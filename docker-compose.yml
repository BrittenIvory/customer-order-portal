services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: customer_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d customer_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portal:portal@db:5432/customer_portal
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-random-string}
      MYOB_BASE_URL: ${MYOB_BASE_URL:-}
      MYOB_API_KEY: ${MYOB_API_KEY:-}
      MYOB_API_ID: ${MYOB_API_ID:-}
      MYOB_USERNAME: ${MYOB_USERNAME:-}
      MYOB_PASSWORD: ${MYOB_PASSWORD:-}
      MYOB_COMPANY: ${MYOB_COMPANY:-}
      MYOB_BRANCH: ${MYOB_BRANCH:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
